/* ---------- 오늘/이번 주 할 일 + 월별 완료 체크 ----------
   card.done = { "2026-10": {ts, memo} } — 해당 월의 업무를 처리 완료했다는 기록.
   변경로그(card.logs)에는 남기지 않아서 편집 이력이 밀려나지 않습니다. */
function pad2(n){ return (n<10?"0":"")+n; }
function periodKey(y,m){ return y+"-"+pad2(m); }
function lastDayOf(y,m){ return new Date(y,m,0).getDate(); }
function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function daysBetween(a,b){ return Math.round((startOfDay(b)-startOfDay(a))/86400000); }
function localDateStr(d){ d=d||new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
var WEEKDAYS = ["일","월","화","수","목","금","토"];

/* due day inside a given month for a rule; exact=false means "일자 미지정" (treated as month end) */
function dueInfo(rule, y, m){
  rule = normalizeRule(rule);
  var last = lastDayOf(y,m);
  if(rule.day_type==="day" && rule.day_value) return {day:Math.min(rule.day_value,last), exact:true};
  if(rule.day_type==="말일") return {day:last, exact:true};
  if(rule.day_type==="초") return {day:Math.min(5,last), exact:true};
  return {day:last, exact:false};
}
/* Overdue tracking starts from the 1st of the month in which this feature is first used,
   so the whole past year does not suddenly show up as "지연". */
function getTrackStart(){
  if(!VOCAB) return null;
  if(!VOCAB._trackStart){
    var n = new Date();
    VOCAB._trackStart = n.getFullYear()+"-"+pad2(n.getMonth()+1)+"-01";
    persistVocab();
  }
  return VOCAB._trackStart;
}
function isDoneKey(card, key){ var e = card.done && card.done[key]; return !!(e && !e.off); }
function cardOccurrences(card, today){
  var out = [];
  var months = monthsForCard(card);
  if(!months.length) return out;
  var y = today.getFullYear(), m = today.getMonth()+1;
  var py = (m===1)?y-1:y, pm = (m===1)?12:m-1;
  [[py,pm],[y,m]].forEach(function(ym){
    if(months.indexOf(ym[1])===-1) return;
    var di = dueInfo(card.schedule_rule, ym[0], ym[1]);
    var due = new Date(ym[0], ym[1]-1, di.day);
    var key = periodKey(ym[0], ym[1]);
    out.push({card:card, key:key, y:ym[0], m:ym[1], due:due, exact:di.exact,
      done:isDoneKey(card, key), diff:daysBetween(today, due)});
  });
  return out;
}
function classifyOcc(o, today, weekEnd, trackStart){
  if(o.done) return "done";
  var curM = today.getMonth()+1;
  var ts = trackStart ? new Date(trackStart+"T00:00:00") : null;
  if(o.diff<0){
    if(ts && o.due<ts && o.m!==curM) return "ignore";
    return "overdue";
  }
  if(o.diff===0) return "today";
  if(o.exact && o.due<=weekEnd) return "week";
  return o.exact ? "later" : "nodate";
}
function weekEndOf(today){
  return new Date(today.getFullYear(), today.getMonth(), today.getDate() + (6-((today.getDay()+6)%7)));
}
function dBadgeHtml(o, kind){
  if(kind==="overdue"){
    return o.m!==(new Date().getMonth()+1) && !o.exact
      ? '<span class="dbadge red">전월 미처리</span>'
      : '<span class="dbadge red">지연 '+(-o.diff)+'일</span>';
  }
  if(kind==="today") return '<span class="dbadge red">오늘</span>';
  if(kind==="week") return '<span class="dbadge amber">D-'+o.diff+'</span>';
  if(kind==="later") return '<span class="dbadge">D-'+o.diff+'</span>';
  if(kind==="nodate") return '<span class="dbadge">'+o.m+'월 중</span>';
  if(kind==="done") return '<span class="dbadge green">완료</span>';
  return "";
}
/* badge for the TOC list: only overdue / today / within 3 days */
function extraPeriodPicker(card){
  var ex = card.period_extra||[];
  return '<span class="period-extra" title="이 업무를 하는 다른 시기도 함께 표시합니다"><span class="pe-label">추가 시기</span>'+
    PERIODS.filter(function(p){return p!==card.period;}).map(function(p){
      return '<label class="pe-opt"><input type="checkbox" data-period-extra="'+esc(p)+'"'+(ex.indexOf(p)!==-1?" checked":"")+'> '+esc(p)+'</label>';
    }).join("")+'</span>';

var RECENT_DAYS = 3;
function recentEditInfo(card){
  if(!card || card.deleted || !card.updatedAt) return null;
  var t = Date.parse(card.updatedAt); if(isNaN(t)) return null;
  var days = (Date.now()-t)/86400000;
  return (days>=0 && days<RECENT_DAYS) ? t : (days<0 ? t : null);
}
function newBadgeHtml(card){
  var t = recentEditInfo(card);
  return t ? '<span class="new-n" title="최근 '+RECENT_DAYS+'일 안에 수정됨 ('+esc(fmtTs(card.updatedAt))+')">N</span>' : "";
}
function titleBadgeFor(card){
  var today = new Date(), ts = getTrackStart(), we = weekEndOf(today);
  var worst = null;
  cardOccurrences(card, today).forEach(function(o){
    var k = classifyOcc(o, today, we, ts);
    if(k==="overdue"){ if(!worst || worst.k!=="overdue" || o.diff<worst.o.diff) worst = {k:k,o:o}; }
    else if(k==="today"){ if(!worst || worst.k==="week") worst = {k:k,o:o}; }
    else if(k==="week" && o.diff<=3 && !worst){ worst = {k:k,o:o}; }
  });
  return worst ? '<span class="title-badge">'+dBadgeHtml(worst.o, worst.k)+'</span>' : "";
}
function todayAlertCount(){
  if(!CARDS) return 0;
  var today = new Date(), ts = getTrackStart(), we = weekEndOf(today), n = 0;
  allRows().forEach(function(c){
    cardOccurrences(c, today).forEach(function(o){
      var k = classifyOcc(o, today, we, ts);
      if(k==="overdue" || k==="today") n++;
    });
  });
  return n;
}
function setOccDone(card, key, on, memo){
  card.done = card.done || {};
  if(on){
    var prev = card.done[key];
    var keepTs = (prev && !prev.off && prev.ts) ? prev.ts : new Date().toISOString();
    card.done[key] = {ts:keepTs, memo:(memo!=null?memo:(prev&&!prev.off&&prev.memo)||"")};
  } else {
    // "취소"도 기록으로 남겨야 동기화할 때 상대 컴퓨터에서도 취소됩니다
    card.done[key] = {ts:new Date().toISOString(), off:true, memo:""};
  }
  card.updatedAt = new Date().toISOString();
  if(idb && canWrite){ idbPut("cards", card).catch(function(){ showToast("저장 실패 — 브라우저 저장소를 확인해 주세요"); }); }
}

var todayOwner = "전체", todayShowDone = false;
function renderToday(){
  var app = document.getElementById("app");
  var today = new Date(), ts = getTrackStart(), we = weekEndOf(today), curM = today.getMonth()+1;
  var groups = {overdue:[], today:[], week:[], later:[], nodate:[], done:[]};
  allRows().forEach(function(c){
    if(todayOwner!=="전체" && tokenize(c.owner).indexOf(todayOwner)===-1) return;
    cardOccurrences(c, today).forEach(function(o){
      var k = classifyOcc(o, today, we, ts);
      if(k==="ignore") return;
      if(k==="done"){ if(o.m===curM) groups.done.push(o); return; }
      groups[k].push(o);
    });
  });
  Object.keys(groups).forEach(function(k){
    groups[k].sort(function(a,b){ return (a.due-b.due) || ((b.card.importance||0)-(a.card.importance||0)) || ((a.card.seq||0)-(b.card.seq||0)); });
  });

  function rowHtml(o, k){
    var c = o.card;
    var when = o.exact ? (o.m+"/"+o.due.getDate()+"("+WEEKDAYS[o.due.getDay()]+")") : (o.m+"월 중");
    return '<div class="today-row'+(o.done?' is-done':'')+'">'+
      '<label class="today-check" title="처리 완료 체크"><input type="checkbox" data-occ-card="'+esc(c.id)+'" data-occ-key="'+esc(o.key)+'"'+(o.done?' checked':'')+(canWrite?'':' disabled')+'></label>'+
      '<span class="cell-no tnum">'+esc(c.no)+'</span>'+
      '<a class="today-title" href="#card/'+encodeURIComponent(c.id)+'">'+esc(c.title)+'</a>'+
      '<span class="today-meta">'+esc(c.owner||"")+'</span>'+
      '<span class="today-rule">'+esc(when)+' · '+esc(ruleLabel(c.schedule_rule))+'</span>'+
      dBadgeHtml(o, k)+
    '</div>';
  }
  var DEFS = [
    ["overdue","⏰ 지연 (기한이 지났는데 아직 처리 체크가 없는 업무)"],
    ["today","📌 오늘 마감"],
    ["week","📅 이번 주 (일요일까지)"],
    ["later","🗓 이번 달 남은 일정"],
    ["nodate","📋 이번 달 업무 (일자 미지정)"]
  ];
  if(todayShowDone) DEFS.push(["done","✅ 이번 달 처리 완료"]);
  var body = DEFS.map(function(d){
    var list = groups[d[0]];
    if(!list.length) return "";
    return '<div class="today-group"><h3>'+d[1]+' <span class="cnt">'+list.length+'건</span></h3><div class="today-list">'+
      list.map(function(o){ return rowHtml(o, d[0]); }).join("")+'</div></div>';
  }).join("");
  if(!body) body = '<div class="empty-state"><div class="big">남은 업무가 없습니다 🎉</div>이번 달 예정된 업무가 모두 처리되었거나, 일정이 설정된 업무가 없습니다.</div>';

  var ownerOpts = '<option value="전체">담당자: 전체</option>'+usedValues("owner").map(function(o){
    return '<option value="'+esc(o)+'"'+(todayOwner===o?" selected":"")+'>'+esc(o)+'</option>';
  }).join("");
  var dateLabel = today.getFullYear()+"."+pad2(curM)+"."+pad2(today.getDate())+" ("+WEEKDAYS[today.getDay()]+")";

  app.innerHTML =
    '<div class="topbar gutter">'+
      '<div class="brand"><h1>📅 오늘 할 일</h1><span class="sub">'+dateLabel+'</span></div>'+
      navBarHtml("today")+
      '<div class="toolbar" style="padding-top:0">'+
        '<select class="filter'+(todayOwner!=="전체"?" active":"")+'" id="today-owner">'+ownerOpts+'</select>'+
        '<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer"><input type="checkbox" id="today-showdone"'+(todayShowDone?" checked":"")+'> 이번 달 완료 항목도 보기</label>'+
      '</div>'+
    '</div>'+
    '<div class="gutter">'+
      '<div class="today-sum">'+
        '<span class="pill-n'+(groups.overdue.length?' red':'')+'">지연 <b>'+groups.overdue.length+'</b></span>'+
        '<span class="pill-n">오늘 <b>'+groups.today.length+'</b></span>'+
        '<span class="pill-n">이번 주 <b>'+groups.week.length+'</b></span>'+
        '<span class="pill-n">이번 달 전체 남음 <b>'+(groups.week.length+groups.today.length+groups.later.length+groups.nodate.length+groups.overdue.filter(function(o){return o.m===curM;}).length)+'</b></span>'+
      '</div>'+
      body+
      '<footer class="note">각 카드의 "업무 일정 기준"(주기·일자)으로 자동 계산됩니다 · 체크박스를 누르면 해당 월 처리 완료로 기록되고, 카드 화면의 "처리 이력"에서 확인·메모할 수 있습니다 · 지연 판정은 이 기능을 처음 연 달의 1일부터 시작합니다 · 수시 업무는 표시되지 않습니다</footer>'+
    '</div>';

  wireNavBar(app);
  document.getElementById("today-owner").addEventListener("change", function(e){ todayOwner = e.target.value; renderToday(); });
  document.getElementById("today-showdone").addEventListener("change", function(e){ todayShowDone = e.target.checked; renderToday(); });
  app.querySelectorAll("[data-occ-card]").forEach(function(cb){
    cb.addEventListener("change", function(){
      var c = byId(cb.getAttribute("data-occ-card"));
      if(!c) return;
      setOccDone(c, cb.getAttribute("data-occ-key"), cb.checked);
      renderToday();
    });
  });
}

/* history block shown at the bottom of a card (view mode only) */
function doneBlockHtml(card){

      (canWrite?'<button type="button" class="btn icon-btn btn-danger" data-done-toggle="'+esc(k)+'">취소</button>':'')+'</div>';

  return '<div class="sec done-block"><h3><span class="label">✅ 처리 이력 ('+y+'년)</span></h3>'+

  '</div>';
}

      }

  });
}

/* ---------- Card view ---------- */
var batchRendering = false;
var editMode = false;
var draft = null;
var logPanelOpen = false;
var deleteArmed = false;

function renderCard(id){
  var card = byId(id);
  if(!card){
    document.getElementById("app").innerHTML = '<div class="gutter"><div class="empty-state"><div class="big">카드를 찾을 수 없습니다</div><a href="#toc">목차로 돌아가기</a></div></div>';
    return;
  }
  if(card.deleted){

        '<div style="font-size:12px;color:var(--fg-muted);margin-bottom:4px">'+esc(card.no)+'</div>'+
        '<h2>'+esc(card.title)+'</h2>'+
        '<div class="note" style="margin-top:10px">🗑 이 카드는 휴지통에 있습니다 (삭제됨: '+fmtTs(card.deletedAt)+')</div>'+
      '</div>'+
      '<div style="padding:14px 20px 20px;display:flex;gap:8px">'+

function renderCardShell(id, isNew){
  var app = document.getElementById("app");
  var idxSorted = CARDS.slice().sort(function(a,b){return (a.seq||0)-(b.seq||0);});
  var idx = idxSorted.findIndex(function(c){return c.id===id;});
  var card = editMode && draft ? draft : byId(id);
  if(!card){ document.getElementById("app").innerHTML = '<div class="gutter"><div class="empty-state"><div class="big">카드를 찾을 수 없습니다</div><a href="#toc">목차로 돌아가기</a></div></div>'; return; }
  var prevId = (!isNew && idx>0) ? idxSorted[idx-1].id : null;
  var nextId = (!isNew && idx>=0 && idx<idxSorted.length-1) ? idxSorted[idx+1].id : null;
  var pColor = PERIOD_COLORS[card.period]||"#ddd";
  var kColor = KPI_COLORS[card.kpi]||"#ddd";
  var stars = card.importance||0;

  function navBtn(targetId,label){
    if(!targetId) return '<button class="btn" disabled>'+label+'</button>';
    return '<button class="btn" data-nav="'+esc(targetId)+'">'+label+'</button>';
  }

  var periodOpts = PERIODS.map(function(p){return '<option'+(card.period===p?" selected":"")+'>'+esc(p)+'</option>';}).join("");
  var kpiOpts = KPIS.map(function(k){return '<option'+(card.kpi===k?" selected":"")+'>'+esc(k)+'</option>';}).join("");
  var catOpts = VOCAB.categories.map(function(c){return '<option'+(card.category===c?" selected":"")+'>'+esc(c)+'</option>';}).join("");

  function moveBtns(key){
    if(!editMode) return "";
    var order = draft.sectionOrder;
    var i = order.indexOf(key);
    return '<span class="move-btns">'+
      '<button type="button" class="btn icon-btn" data-move-up="'+key+'" '+(i<=0?"disabled":"")+'>▲</button>'+
      '<button type="button" class="btn icon-btn" data-move-down="'+key+'" '+(i>=order.length-1?"disabled":"")+'>▼</button>'+
      '</span>';
  }

  function secWrap(key, innerHtml){
    var skip = (key==="images" && !(card.images||[]).length) ? " print-skip" : "";
    return '<div class="sec'+skip+'" data-sec="'+key+'"><h3><span class="label">'+esc(SECTION_LABELS[key])+'</span>'+moveBtns(key)+'</h3>'+innerHtml+'</div>';
  }

  function textField(field, multiline, placeholder){
    var val = card[field]||"";
    if(!editMode) return '<div class="body">'+(val?nl2br(val):'<span style="color:var(--fg-faint)">-</span>')+'</div>';
    return multiline
      ? '<textarea class="field" data-field="'+field+'" rows="3" placeholder="'+esc(placeholder||"")+'">'+esc(val)+'</textarea><div class="hint">이미지를 복사해 Ctrl/Cmd+V로 붙여넣을 수 있습니다</div>'
      : '<input class="field" type="text" data-field="'+field+'" value="'+esc(val)+'" placeholder="'+esc(placeholder||"")+'">';
  }

  function resultSection(){
    if(!editMode){
      var pills = CHECK_OPTIONS.map(function(o){
        var on = !!(card.result_checks && card.result_checks[o.key]);
        return '<span class="pill'+(on?" on":"")+'">'+o.emoji+' '+esc(o.key)+(on?' ✓':'')+'</span>';
      }).join("");
      if(card.result_etc) pills += '<span class="pill on">✏️ 기타: '+esc(card.result_etc)+' ✓</span>';
      return '<div class="check-pills">'+pills+'</div>';
    }
    var boxes = CHECK_OPTIONS.map(function(o){
      var on = !!(card.result_checks && card.result_checks[o.key]);
      return '<label><input type="checkbox" data-check="'+esc(o.key)+'" '+(on?"checked":"")+'>'+o.emoji+' '+esc(o.key)+'</label>';
    }).join("");
    return '<div class="check-edit">'+boxes+'</div>'+
      '<div class="etc-row">✏️ 기타: <input class="field" type="text" id="result-etc" value="'+esc(card.result_etc||"")+'" placeholder="직접 입력"></div>';
  }

  function detailSection(){
    var steps = card.detail_steps||[];
    if(!editMode){
      if(!steps.length) return '<div class="body" style="color:var(--fg-faint)">-</div>';
      var circled = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮";
      return '<div class="body">'+steps.map(function(s,i){ return (circled[i]||((i+1)+".")) + " " + renderRich(s); }).join("<br>")+'</div>';
    }
    var rows = steps.map(function(s,i){
      return '<div class="step-row" data-step-idx="'+i+'"><span class="step-num">'+(i+1)+'.</span>'+
        '<input class="field" type="text" data-step-field value="'+esc(s)+'">'+
        '<button type="button" class="btn icon-btn btn-danger" data-step-remove="'+i+'">✕</button></div>';
    }).join("");
    return '<div class="steps-list">'+rows+'</div>'+
      '<div class="hint">각 단계 칸에 커서를 두고 이미지를 복사해 Ctrl/Cmd+V로 붙여넣을 수 있습니다</div>'+
      '<button type="button" class="btn btn-sm" id="btn-add-step" style="margin-top:8px">+ 단계 추가</button>';
  }

  function ruleEditorHtml(rule){
    rule = normalizeRule(rule);
    var modeChips = '<div class="chiprow" style="margin:0 0 8px">'+
      '<button type="button" class="chip'+(rule.mode==="freq"?" active":"")+'" data-rule-mode="freq">주기 기준</button>'+
      '<button type="button" class="chip'+(rule.mode==="months"?" active":"")+'" data-rule-mode="months">특정월 선택(중복 가능)</button>'+
    '</div>';
    var body;
    if(rule.mode==="months"){
      var monthChips = "";
      for(var m=1;m<=12;m++){
        var on = (rule.months||[]).indexOf(m)!==-1;
        monthChips += '<button type="button" class="chip'+(on?" active":"")+'" data-rule-month="'+m+'">'+m+'월</button>';
      }
      body = '<div class="chiprow" style="margin:0">'+monthChips+'</div>';

      var freqOpts = FREQ_OPTIONS.map(function(f){return '<option'+(rule.freq===f?" selected":"")+'>'+f+'</option>';}).join("");

      var dayTypeOpts = DAY_TYPE_OPTIONS.map(function(o){

        return '<option value="'+o.key+'"'+(rule.day_type===o.key?" selected":"")+dis+'>'+o.label+'</option>';
      }).join("");
      body = '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
        '<select class="field" style="width:auto" data-rule-freq>'+freqOpts+'</select>'+
        '<select class="field" style="width:auto" data-rule-offset'+offsetDisabled+'><option value="당월"'+(rule.offset==="당월"?" selected":"")+'>당월</option><option value="익월"'+(rule.offset==="익월"?" selected":"")+'>익월</option></select>'+
        '<select class="field" style="width:auto" data-rule-daytype>'+dayTypeOpts+'</select>'+
        (rule.day_type==="day" ? '<input class="field" type="number" min="1" max="31" style="width:70px" data-rule-dayvalue value="'+(rule.day_value||"")+'" placeholder="일">' : '')+
        '<label style="display:flex;align-items:center;gap:4px;font-size:13px"><input type="checkbox" data-rule-until '+(rule.until?"checked":"")+'> 까지</label>'+
      '</div>';
    }
    var preview = ruleLabel(rule);
    return '<div class="box ref" style="margin-bottom:10px"><div class="box-title">📅 연간계획 연동 설정</div>'+modeChips+body+
      (preview?'<div class="hint" style="margin-top:8px">미리보기: <b>'+esc(preview)+'</b> → 연간업무계획에 이 월로 표시됩니다</div>':'<div class="hint" style="margin-top:8px">수시 업무는 연간업무계획에 표시되지 않습니다</div>')+
    '</div>';
  }

  function ruleViewHtml(rule){
    rule = normalizeRule(rule);
    var label = ruleLabel(rule);
    var months = monthsFromRule(rule);
    return '<div class="box ref" style="margin-bottom:10px"><div class="box-title">📅 연간계획 연동</div><div class="body">'+
      (label?esc(label)+'<br>':'')+
      (months.length?('적용 월: '+months.map(function(mo){return mo+"월";}).join(", ")):'연간업무계획에 표시되지 않음(수시)')+
    '</div></div>';
  }

  function scheduleSection(){
    var lines = (card.schedule||"").split("\n").filter(Boolean);
    if(editMode){
      return ruleEditorHtml(draft.schedule_rule)+
        '<textarea class="field" data-field="schedule" rows="3" placeholder="구분 | 시기 | 비고 (추가 메모/예외사항)">'+esc(card.schedule||"")+'</textarea><div class="hint">줄마다 "구분 | 시기 | 비고" 형식으로 입력 — 참고용 메모이며, 연간업무계획 반영은 위 "연동 설정"을 따릅니다</div>';
    }
    var ruleHtml = ruleViewHtml(card.schedule_rule);
    if(!lines.length) return ruleHtml;
    var trs = lines.map(function(l){
      var cells = l.split("|").map(function(s){return s.trim();});
      while(cells.length<3) cells.push("-");
      return '<tr><td>'+esc(cells[0])+'</td><td>'+esc(cells[1])+'</td><td>'+esc(cells[2])+'</td></tr>';
    }).join("");
    return ruleHtml+'<table class="sched-table"><thead><tr><th>구분</th><th>시기</th><th>비고</th></tr></thead><tbody>'+trs+'</tbody></table>';
  }

  function imagesSection(){
    var imgs = card.images||[];
    var tiles = imgs.map(function(im,i){
      var cap = editMode
        ? '<input type="text" data-img-caption="'+i+'" value="'+esc(im.caption||"")+'" placeholder="설명(선택)">'
        : (im.caption ? '<span class="cap-text">'+esc(im.caption)+'</span>' : '');
      var del = editMode ? '<div class="img-actions"><button type="button" class="btn icon-btn btn-danger" data-img-remove="'+i+'">삭제</button></div>' : '';
      var imgUrl = resolveAttachmentUrl(im.id, im.file) || im.url || "";
      var imgTag = imgUrl ? '<img src="'+esc(imgUrl)+'" alt="'+esc(im.caption||"첨부 이미지")+'" loading="lazy">' : '<div class="img-loading">불러오는 중…</div>';
      return '<div class="img-card">'+imgTag+'<div class="cap">'+cap+'</div>'+del+'</div>';
    }).join("");
    var addTile = editMode ? '<label class="add-tile">+ 이미지 추가<input type="file" accept="image/*" id="img-upload-input" style="display:none"></label>' : "";
    if(!imgs.length && !editMode) return '<div class="body" style="color:var(--fg-faint)">등록된 이미지가 없습니다</div>';
    return '<div class="img-grid">'+tiles+addTile+'</div>';
  }

  var sectionRenderers = {
    keywords: function(){ return textField("keywords", false, "세미콜론(;)으로 구분") + (editMode?'<div class="hint">세미콜론(;)으로 구분</div>':''); },
    purpose: function(){ return textField("purpose", true); },
    result: resultSection,
    flow: function(){ return textField("flow", true, "① 단계 → ② 단계") + (editMode?'<div class="hint">" → "로 단계 구분</div>':''); },
    detail: detailSection,
    submit: function(){
      var SUBMIT_ROWS = [
        {key:"dest", label:"제출처", field:"submit_dest"},
        {key:"way", label:"제출방법", field:"submit_way"},
        {key:"deadline", label:"제출기한", field:"submit_deadline"},
        {key:"attach", label:"첨부서류", field:"submit_attach"},
        {key:"storage", label:"보관방법", field:"submit_storage"},
        {key:"law", label:"관련 법령", field:"submit_law"}
      ];
      var vis = Object.assign({dest:true,way:true,deadline:true,attach:true,storage:true,law:true}, card.submit_visible||{});
      if(editMode){
        var rows = SUBMIT_ROWS.map(function(r){
          var inputHtml = (r.key==="law")
            ? '<div class="law-picker">'+
                '<select data-law-pick class="field">'+
                  '<option value="">▾ 목록에서 추가…</option>'+
                  (VOCAB.laws||[]).map(function(l){return '<option value="'+esc(l)+'">'+esc(l)+'</option>';}).join("")+
                '</select>'+
                '<input class="field" data-field="submit_law" value="'+esc(card.submit_law)+'" placeholder="직접 입력 (여러 개는 ; 로 구분)">'+
              '</div>'
            : '<input class="field" data-field="'+r.field+'" value="'+esc(card[r.field])+'">';
          return '<dt><label class="row-vis"><input type="checkbox" data-submit-vis="'+r.key+'"'+(vis[r.key]?" checked":"")+'> '+r.label+'</label></dt><dd>'+inputHtml+'</dd>';
        }).join("");
        return '<div class="kv">'+rows+'</div><div class="hint">체크를 해제한 항목은 보기 화면에서 숨겨집니다</div>';
      }
      var shownRows = SUBMIT_ROWS.filter(function(r){ return vis[r.key]; }).map(function(r){
        return '<dt>'+r.label+'</dt><dd>'+esc(card[r.field]||"-")+'</dd>';
      }).join("");
      if(!shownRows) return '<div class="body" style="color:var(--fg-faint)">표시할 제출정보 항목이 없습니다</div>';
      return '<dl class="kv">'+shownRows+'</dl>';
    },
    schedule: scheduleSection,
    images: imagesSection,
    caution_ref: function(){
      return '<div class="box-grid">'+
        '<div class="box warn"><div class="box-title">⚠ 주의</div>'+(editMode?'<textarea class="field" data-field="caution" rows="3">'+esc(card.caution)+'</textarea>':'<div class="body">'+nl2br(card.caution||"-")+'</div>')+'</div>'+
        '<div class="box ref"><div class="box-title">📎 참고</div>'+(editMode?'<textarea class="field" data-field="reference" rows="3">'+esc(card.reference)+'</textarea>':'<div class="body">'+nl2br(card.reference||"-")+'</div>')+'</div>'+
        '</div>';
    }
  };

  var order = (editMode?draft.sectionOrder:card.sectionOrder) || DEFAULT_ORDER;
  var sectionsHtml = order.map(function(key){
    if(!sectionRenderers[key]) return "";
    return secWrap(key, sectionRenderers[key]());
  }).join("");

  var filesHtml = (function(){
    var files = card.files||[];
    var rows = files.map(function(f,i){
      var del = (canWrite) ? '<button type="button" class="btn icon-btn btn-danger" data-file-remove="'+i+'">삭제</button>' : "";
      var furl = resolveAttachmentUrl(f.id, f.file);
      var nameHtml = furl
        ? '<a class="fname" href="'+esc(furl)+'" download="'+esc(f.name)+'">'+esc(f.name)+'</a>'
        : '<span class="fname" style="color:var(--fg-faint)">'+esc(f.name)+' (불러오는 중…)</span>';
      return '<div class="file-row"><span>📄</span>'+nameHtml+'<span class="fsize">'+esc(fmtSize(f.sizeBytes))+'</span>'+del+'</div>';
    }).join("");
    var addRow = canWrite ? '<label class="btn btn-sm" style="width:fit-content">+ 파일 추가<input type="file" id="file-upload-input" style="display:none"></label>' : "";
    return '<div class="sec'+(files.length?'':' print-skip')+'"><h3><span class="label">첨부파일</span></h3>'+
      (rows || '<div class="body" style="color:var(--fg-faint);margin-bottom:8px">첨부된 파일이 없습니다</div>')+
      (rows?'<div style="height:8px"></div>':'')+ addRow + '</div>';
  })();

  app.innerHTML =
    '<div class="gutter">'+
    '<div class="card-nav">'+
      '<a class="btn" href="#toc">← 목차</a>'+
      (isNew?'':navBtn(prevId,"← 이전 카드")+navBtn(nextId,"다음 카드 →"))+
      '<span class="spacer"></span>'+
      ((isNew||editMode)?'':'<button class="btn btn-sm" id="btn-print" title="A4 한 장 기준으로 인쇄하거나 PDF로 저장합니다">🖨 인쇄/PDF</button>')+
      (isNew?'':'<button class="btn btn-sm" id="btn-log">📜 로그</button>')+
      (canWrite?
        (editMode
          ? '<button class="btn btn-ghost" id="btn-cancel">취소</button><button class="btn btn-primary" id="btn-save">저장</button>'
          : '<button class="btn" id="btn-edit">✎ 수정</button><button class="btn btn-danger" id="btn-delete">'+(deleteArmed?"정말 삭제할까요?":"🗑 삭제")+'</button>'+(deleteArmed?'<button class="btn" id="btn-delete-cancel">취소</button>':''))
        : '<span class="readonly-note">보기 전용</span>')+
    '</div>'+
    '<div class="card-sheet">'+
      '<div class="card-strip" style="background:'+pColor+'1a">'+
        '<div class="left">'+
          (editMode?'<select data-field="period">'+periodOpts+'</select>'+extraPeriodPicker(card):periodBadges(card))+
          '<span class="no tnum">'+esc(card.no)+'</span>'+
        '</div>'+
        (editMode?'<select data-field="kpi">'+kpiOpts+'</select>':'<span class="badge" style="background:'+kColor+'">'+esc(card.kpi)+'</span>')+
      '</div>'+
      '<div class="card-head">'+
        (editMode?'<div style="font-size:12px;color:var(--fg-muted);margin-bottom:4px">분류: <select data-field="category">'+catOpts+'</select></div>':'<div style="font-size:12px;color:var(--fg-muted);margin-bottom:4px">'+esc(card.category)+'</div>')+
        '<h2>'+(editMode?'<input data-field="title" type="text" value="'+esc(card.title)+'">':esc(card.title))+'</h2>'+
        '<div class="chips">'+
          '<span class="chip-item">👤 '+(editMode?'<input class="field" style="width:120px" list="dl-owner" data-field="owner" value="'+esc(card.owner)+'"><datalist id="dl-owner">'+VOCAB.owners.map(function(o){return '<option value="'+esc(o)+'">';}).join("")+'</datalist>':esc(card.owner||"-"))+'</span>'+
          '<span class="chip-item">'+(editMode?
            '<span class="star-pick" id="starpick">'+[1,2,3,4,5].map(function(n){return '<span data-n="'+n+'" class="'+(n<=stars?"on":"")+'">★</span>';}).join("")+'</span>'
            : '<span class="stars">'+"★".repeat(stars)+"☆".repeat(5-stars)+'</span>')+'</span>'+
          '<span class="chip-item">🕐 '+(editMode?'<input class="field" style="width:90px" data-field="duration" value="'+esc(card.duration)+'">':esc(card.duration||"-"))+'</span>'+
          '<span class="chip-item">🏢 '+(editMode?'<input class="field" style="width:180px" list="dl-dept" data-field="dept" value="'+esc(card.dept)+'"><datalist id="dl-dept">'+VOCAB.depts.map(function(d){return '<option value="'+esc(d)+'">';}).join("")+'</datalist>':esc(card.dept||"-"))+'</span>'+
        '</div>'+
      '</div>'+
      sectionsHtml+
      filesHtml+
      (isNew?'':doneBlockHtml(card))+
      '<div class="print-only print-foot"><span>'+esc(card.no)+' · Oscar</span><span class="print-stamp">출력일시: '+esc(fmtTs(new Date().toISOString()))+'</span></div>'+
      (editMode?'<div class="edit-actions"><button class="btn btn-ghost" id="btn-cancel2">취소</button><button class="btn btn-primary" id="btn-save2">저장</button></div>':'')+
    '</div>'+
    (logPanelOpen ? logOverlayHtml(card) : '')+
    '</div>';

  if(!batchRendering) wireCardEvents(id, isNew, card);
}

function logOverlayHtml(card){
  var logs = (card.logs||[]).slice().reverse();
  var items = logs.map(function(l){
    var detailsHtml = (l.details && l.details.length)
      ? '<div class="log-details">'+l.details.map(function(d){
          return '<div class="log-detail"><b>'+esc(d.label)+'</b>: '+esc(d.from)+' → '+esc(d.to)+'</div>';
        }).join("")+'</div>'
      : '';
    return '<div class="log-entry"><div class="log-entry-head">'+esc(l.summary)+'<span class="ts">'+fmtTs(l.ts)+'</span></div>'+detailsHtml+'</div>';
  }).join("");
  return '<div class="log-overlay" id="log-overlay"><div class="log-panel"><h3>변경 로그</h3>'+(items||'<div class="body" style="color:var(--fg-faint)">기록 없음</div>')+'<button class="btn" id="btn-log-close" style="margin-top:12px">닫기</button></div></div>';
}

function wireCardEvents(id, isNew, card){
  var app = document.getElementById("app");

  // files: available whether or not the card is in text-edit mode
  wireFileUpload(card, id, isNew);

  var printBtn = document.getElementById("btn-print");
  if(printBtn) printBtn.addEventListener("click", function(){ window.print(); });
  app.querySelectorAll("[data-done-toggle]").forEach(function(b){
    b.addEventListener("click", function(){
      var k = b.getAttribute("data-done-toggle");
      setOccDone(card, k, !isDoneKey(card, k));
      renderCardShell(id, isNew);
    });
  });
  app.querySelectorAll("[data-done-memo]").forEach(function(inp){
    inp.addEventListener("change", function(){
      var k = inp.getAttribute("data-done-memo");
      if(isDoneKey(card, k)){ setOccDone(card, k, true, inp.value); }
    });
  });

  app.querySelectorAll('[data-nav]').forEach(function(b){ b.addEventListener("click", function(){ editMode=false; draft=null; logPanelOpen=false; location.hash="card/"+encodeURIComponent(b.getAttribute("data-nav")); }); });

  var logBtn = document.getElementById("btn-log");
  if(logBtn) logBtn.addEventListener("click", function(){ logPanelOpen=true; renderCardShell(id,isNew); });
  var logClose = document.getElementById("btn-log-close");
  if(logClose) logClose.addEventListener("click", function(){ logPanelOpen=false; renderCardShell(id,isNew); });
  var logOverlay = document.getElementById("log-overlay");
  if(logOverlay) logOverlay.addEventListener("click", function(e){ if(e.target===logOverlay){ logPanelOpen=false; renderCardShell(id,isNew); } });

  if(!editMode){
    var editBtn = document.getElementById("btn-edit");
    if(editBtn) editBtn.addEventListener("click", function(){ if(!canWrite) return; editMode=true; draft=JSON.parse(JSON.stringify(card)); draft.schedule_rule = normalizeRule(draft.schedule_rule); renderCardShell(id,isNew); });
    var delBtn = document.getElementById("btn-delete");
    if(delBtn) delBtn.addEventListener("click", function(){ if(!canWrite) return;
      if(!deleteArmed){ deleteArmed=true; renderCardShell(id,isNew); return; }
      card.deleted = true;
      card.deletedAt = new Date().toISOString();
      persistCard(card, "카드 삭제 (휴지통으로 이동)");
      showToast("카드를 휴지통으로 이동했습니다 — 휴지통에서 복구할 수 있습니다");
      location.hash = "toc";
    });
    var delCancel = document.getElementById("btn-delete-cancel");
    if(delCancel) delCancel.addEventListener("click", function(){ deleteArmed=false; renderCardShell(id,isNew); });
    return;
  }

  // ---- edit mode wiring ----
  app.querySelectorAll("[data-field]").forEach(function(el){
    var f = el.getAttribute("data-field");
    el.addEventListener("input", function(){ draft[f] = el.value; });
    el.addEventListener("change", function(){
      draft[f] = el.value;
      if(f==="period"){ draft.period_extra = (draft.period_extra||[]).filter(function(p){return p!==draft.period;}); renderCardShell(id,isNew); }
    });
  });
  app.querySelectorAll("[data-period-extra]").forEach(function(cb){
    cb.addEventListener("change", function(){
      var arr = (draft.period_extra||[]).slice(), p = cb.getAttribute("data-period-extra"), i = arr.indexOf(p);
      if(cb.checked && i===-1) arr.push(p);
      if(!cb.checked && i!==-1) arr.splice(i,1);
      draft.period_extra = arr;
    });
  });
  // submit-info row visibility toggles
  app.querySelectorAll("[data-submit-vis]").forEach(function(cb){
    cb.addEventListener("change", function(){
      draft.submit_visible = draft.submit_visible || {};
      draft.submit_visible[cb.getAttribute("data-submit-vis")] = cb.checked;
    });
  });
  // remember any newly-typed law/regulation so it appears in the picker next time
  var lawInput = app.querySelector('[data-field="submit_law"]');
  if(lawInput) lawInput.addEventListener("change", function(){
    String(lawInput.value||"").split(/[;,\/·\n]/).forEach(function(t){ addVocab("laws", t); });
  });
  // "관련 법령" list picker: choosing an option appends it into the free-text field
  var lawPick = app.querySelector("[data-law-pick]");
  if(lawPick) lawPick.addEventListener("change", function(){
    var v = lawPick.value;
    if(!v) return;
    var cur = String(draft.submit_law||"").trim();
    var parts = cur ? cur.split(/;\s*/).filter(Boolean) : [];
    if(parts.indexOf(v)===-1) parts.push(v);
    draft.submit_law = parts.join("; ");
    addVocab("laws", v);
    lawPick.value = "";
    if(lawInput) lawInput.value = draft.submit_law;
  });
  var sp = document.getElementById("starpick");
  if(sp) sp.querySelectorAll("span").forEach(function(s){
    s.addEventListener("click", function(){ draft.importance = parseInt(s.getAttribute("data-n"),10); renderCardShell(id,isNew); });
  });

  // result checkboxes
  app.querySelectorAll("[data-check]").forEach(function(cb){
    cb.addEventListener("change", function(){
      draft.result_checks = draft.result_checks || {};
      draft.result_checks[cb.getAttribute("data-check")] = cb.checked;
    });
  });
  var etc = document.getElementById("result-etc");
  if(etc) etc.addEventListener("input", function(){ draft.result_etc = etc.value; });

  // detail steps
  app.querySelectorAll("[data-step-field]").forEach(function(inp, i){
    wirePasteImage(inp);
    inp.addEventListener("input", function(){ draft.detail_steps[i] = inp.value; });
  });
  app.querySelectorAll("[data-step-remove]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var i = parseInt(btn.getAttribute("data-step-remove"),10);
      draft.detail_steps.splice(i,1);
      renderCardShell(id,isNew);
    });
  });
  var addStepBtn = document.getElementById("btn-add-step");
  if(addStepBtn) addStepBtn.addEventListener("click", function(){
    draft.detail_steps = draft.detail_steps||[];
    draft.detail_steps.push("");
    renderCardShell(id,isNew);
  });

  // section reorder
  app.querySelectorAll("[data-move-up]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var k = btn.getAttribute("data-move-up");
      var o = draft.sectionOrder, i = o.indexOf(k);
      if(i>0){ o.splice(i,1); o.splice(i-1,0,k); renderCardShell(id,isNew); }
    });
  });
  app.querySelectorAll("[data-move-down]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var k = btn.getAttribute("data-move-down");
      var o = draft.sectionOrder, i = o.indexOf(k);
      if(i<o.length-1){ o.splice(i,1); o.splice(i+1,0,k); renderCardShell(id,isNew); }
    });
  });

  // images
  app.querySelectorAll("[data-img-caption]").forEach(function(inp){
    var i = parseInt(inp.getAttribute("data-img-caption"),10);
    inp.addEventListener("input", function(){ draft.images[i].caption = inp.value; });
  });
  app.querySelectorAll("[data-img-remove]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var i = parseInt(btn.getAttribute("data-img-remove"),10);
      draft.images.splice(i,1);
      renderCardShell(id,isNew);
    });
  });
  var imgInput = document.getElementById("img-upload-input");
  if(imgInput) imgInput.addEventListener("change", function(){
    var file = imgInput.files && imgInput.files[0];
    if(!file) return;
    var bid = uid();
    var entry = storeAttachment(bid, file);
    entry.caption = "";
    draft.images = draft.images||[];
    draft.images.push(entry);
    renderCardShell(id,isNew);
    showToast("이미지가 추가되었습니다");
  });

  app.querySelectorAll("textarea.field").forEach(function(ta){ wirePasteImage(ta); });

  // schedule rule editor
  draft.schedule_rule = normalizeRule(draft.schedule_rule);
  app.querySelectorAll("[data-rule-mode]").forEach(function(b){
    b.addEventListener("click", function(){ draft.schedule_rule.mode = b.getAttribute("data-rule-mode"); renderCardShell(id,isNew); });
  });
  var rf = app.querySelector("[data-rule-freq]");
  if(rf) rf.addEventListener("change", function(){ draft.schedule_rule.freq = rf.value; renderCardShell(id,isNew); });
  var ro = app.querySelector("[data-rule-offset]");
  if(ro) ro.addEventListener("change", function(){ draft.schedule_rule.offset = ro.value; renderCardShell(id,isNew); });
  var rd = app.querySelector("[data-rule-daytype]");
  if(rd) rd.addEventListener("change", function(){ draft.schedule_rule.day_type = rd.value; renderCardShell(id,isNew); });
  var rv = app.querySelector("[data-rule-dayvalue]");
  if(rv) rv.addEventListener("input", function(){ draft.schedule_rule.day_value = parseInt(rv.value,10)||null; var p=document.querySelector(".box.ref .hint b"); if(p) p.textContent = ruleLabel(draft.schedule_rule); });
  var ru = app.querySelector("[data-rule-until]");
  if(ru) ru.addEventListener("change", function(){ draft.schedule_rule.until = ru.checked; renderCardShell(id,isNew); });
  app.querySelectorAll("[data-rule-month]").forEach(function(b){
    b.addEventListener("click", function(){
      var mo = parseInt(b.getAttribute("data-rule-month"),10);
      draft.schedule_rule.months = draft.schedule_rule.months||[];
      var i = draft.schedule_rule.months.indexOf(mo);
      if(i===-1) draft.schedule_rule.months.push(mo); else draft.schedule_rule.months.splice(i,1);
      renderCardShell(id,isNew);
    });
  });

  ["btn-cancel","btn-cancel2"].forEach(function(bid){
    var b=document.getElementById(bid); if(b) b.addEventListener("click", function(){
      editMode=false; draft=null;
      if(isNew){ location.hash="toc"; } else { renderCardShell(id,isNew); }
    });
  });
  ["btn-save","btn-save2"].forEach(function(bid){
    var b=document.getElementById(bid); if(b) b.addEventListener("click", function(){ saveCard(id, isNew); });
  });
}

function wireFileUpload(card, id, isNew){

function wirePasteImage(textarea){
  var isMultiline = textarea.tagName === "TEXTAREA";
  textarea.addEventListener("paste", function(e){
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for(var i=0;i<items.length;i++){
      if(items[i].type && items[i].type.indexOf("image/")===0){
        e.preventDefault();
        var file = items[i].getAsFile();
        if(!file) continue;
        var bid = uid();
        var entry = storeAttachment(bid, file);
        var token = entry.file ? "[[img:"+bid+"|"+entry.file+"]]" : "[[img:"+bid+"]]";
        var start = textarea.selectionStart, end = textarea.selectionEnd;
        var v = textarea.value;
        var ins, newPos;
        if(isMultiline){
          ins = "\n"+token+"\n";
          newPos = start + token.length + 2;
        } else {
          // single-line input: avoid embedded newlines, just pad with spaces as needed
          var pre = (start>0 && v.charAt(start-1)!==" ") ? " " : "";
          var post = (end<v.length && v.charAt(end)!==" ") ? " " : "";
          ins = pre+token+post;
          newPos = start + ins.length;
        }
        textarea.value = v.slice(0,start)+ins+v.slice(end);
        textarea.selectionStart = textarea.selectionEnd = newPos;
        textarea.dispatchEvent(new Event("input"));
        showToast("이미지가 삽입되었습니다");
        break;
      }
    }
  });
}

  Object.keys(fields).forEach(function(f){

  if(JSON.stringify(oldCard.detail_steps)!==JSON.stringify(newCard.detail_steps)){

  }
  if(JSON.stringify(oldCard.images)!==JSON.stringify(newCard.images)){
    details.push({label:"이미지", from:(oldCard.images||[]).length+"개", to:(newCard.images||[]).length+"개"});
  }
  if(JSON.stringify(oldCard.files)!==JSON.stringify(newCard.files)){
    details.push({label:"첨부파일", from:(oldCard.files||[]).length+"개", to:(newCard.files||[]).length+"개"});

  if(JSON.stringify(oldCard.sectionOrder)!==JSON.stringify(newCard.sectionOrder)){
    details.push({label:"항목 순서", from:"변경 전 순서", to:"변경 후 순서"});
  }
  if(JSON.stringify(oldCard.schedule_rule)!==JSON.stringify(newCard.schedule_rule)){

function saveCard(id, isNew){
  var newCard = draft;
  addVocab("categories", newCard.category);
  addVocabMulti("owners", newCard.owner);
  addVocabMulti("depts", newCard.dept);

  if(isNew){
    newCard.logs = [{ts:new Date().toISOString(), summary:"카드 생성"}];
    newCard.updatedAt = new Date().toISOString();
    CARDS.push(newCard);
    snapCard(newCard);
    if(idb && canWrite){ idbPut("cards", newCard).catch(function(){ showToast("저장 실패 — 브라우저 저장소를 확인해 주세요"); }); }
    editMode=false; draft=null;
    showToast("카드가 생성되었습니다");
    location.hash = "card/"+encodeURIComponent(newCard.id);

  CARDS[idx] = newCard;
  persistCard(newCard, diff.summary, diff.details);
  editMode = false; draft = null;
  renderCardShell(id, false);
  showToast("저장되었습니다");
}

/* ---------- boot: fully offline, IndexedDB-backed (no server, no network) ---------- */
/* Returning users already have CARDS/VOCAB saved locally (or in a shared
   folder), and that saved data is always preferred over the file's bundled
   SEED_* content on boot — otherwise every edit would be wiped on reload.
   But that also means a newer HTML file's improvements (e.g. an updated
   관련 법령 picker list, or newly-filled-in 관련 법령 values) silently never
   reach someone who already has local data. This runs once per boot to pull
   those additions forward without ever touching a field the person already
   customized themselves. */
/* 이 HTML 파일에 내장된 업무카드(SEED)와, 이 컴퓨터 브라우저에 이미 저장된 내용이 다를 때
   (예: 예전 버전 파일을 쓰던 컴퓨터에 새 버전 파일을 열었을 때) 합치기를 제안합니다. */
function seedAsSyncData(){
  var now = new Date().toISOString();
  var localById = {}; (CARDS||[]).forEach(function(c){ localById[c.id] = c; });
  var cards = SEED_CARDS.map(function(sc){
    var inc = JSON.parse(JSON.stringify(sc)), loc = localById[sc.id];
    if(!loc) return inc;                                     // 이 컴퓨터에 없는 새 카드
    var f = {};
    Object.keys(inc).forEach(function(k){
      if(SYNC_SKIP[k] || k==="fts") return;
      if(sameVal(loc[k], inc[k])) return;
      if(k==="deleted" || k==="deletedAt" || (loc.fts && loc.fts[k])){ inc[k] = loc[k]; return; }   // 삭제 표시·이 컴퓨터에서 고친 항목은 그대로 둠
      f[k] = {t:now, b:[sideEntry(loc,k).t, ""]};              // 고친 적 없는 항목만 새 파일 내용으로
    });
    ["deleted","deletedAt"].forEach(function(k){ if(loc[k]!==undefined) inc[k] = loc[k]; else delete inc[k]; });
    inc.fts = f;
    return inc;
  });
  (SEED_RETIRED||[]).forEach(function(rid){
    var loc = localById[rid]; if(!loc || loc.deleted) return;
    var inc = JSON.parse(JSON.stringify(loc)); inc.deleted = true; inc.deletedAt = now;
    inc.fts = {deleted:{t:now, b:[sideEntry(loc,"deleted").t, ""]}, deletedAt:{t:now, b:[sideEntry(loc,"deletedAt").t, ""]}};
    cards.push(inc);
  });
  return {type:"smartjob-sync", version:2, exportedAt:(SEED_CARDS.reduce(function(m,c){ return (c.updatedAt||"")>m?c.updatedAt:m; },"")||now),
    cards:cards, vocab:JSON.parse(JSON.stringify(SEED_VOCAB||{})), events:[], seqCounter:0, blobs:[]};
}
function seedSignature(){
  var last = SEED_CARDS.reduce(function(m,c){ return (c.updatedAt||"")>m?c.updatedAt:m; },"");
  return SEED_CARDS.length+"|"+last;
}
function offerSeedMerge(){
  if(!canWrite || !SEED_CARDS || !SEED_CARDS.length) return;
  var plan; try{ plan = buildSyncPlan(seedAsSyncData()); }catch(e){ return; }
  if(planIsEmpty(plan)) return;
  idbGet("meta","seedPromptSig").catch(function(){return null;}).then(function(rec){
    if(rec && rec.value===seedSignature()) return;
    var takeCnt = plan.cardPlans.reduce(function(n,cp){return n+cp.takes.length;},0);
    var confCnt = plan.cardPlans.reduce(function(n,cp){return n+cp.conflicts.length;},0);
    var ov = document.createElement("div"); ov.className = "log-overlay"; ov.id = "seed-overlay"; ov.style.alignItems = "center";
    ov.innerHTML = '<div class="log-panel" style="max-width:440px"><h3 style="font-size:16px">📦 새 업무카드가 있습니다</h3>'+
      '<p style="font-size:13.5px;line-height:1.7;margin:8px 0 12px">이 HTML 파일에 들어 있는 업무카드와 이 컴퓨터에 저장된 내용이 다릅니다. 이전 버전 파일을 쓰던 컴퓨터에서 새 파일을 열면 이런 안내가 나옵니다.<br>'+
      (plan.newCards.length?'· 이 컴퓨터에 없는 새 카드 <b>'+plan.newCards.length+'</b>장<br>':'')+
      (takeCnt?'· 새 파일에서 달라진 항목 <b>'+takeCnt+'</b>건<br>':'')+
      (confCnt?'· 이 컴퓨터에서 고친 것과 겹치는 항목 <b>'+confCnt+'</b>건(직접 선택)<br>':'')+
      '<span style="color:var(--fg-muted);font-size:12.5px">합치기 전에 미리보기로 확인하고, 직접 고친 내용은 그대로 유지됩니다. 합치기 직전 상태는 되돌릴 수 있습니다.</span></p>'+
      '<div style="display:flex;gap:8px"><button type="button" class="btn" id="seed-later" style="flex:1;justify-content:center">나중에</button><button type="button" class="btn btn-primary" id="seed-go" style="flex:2;justify-content:center">합치기 미리보기</button></div></div>';
    document.body.appendChild(ov);
    function remember(){ idbPut("meta", {key:"seedPromptSig", value:seedSignature()}).catch(function(){}); }
    document.getElementById("seed-later").addEventListener("click", function(){ remember(); ov.remove(); });
    document.getElementById("seed-go").addEventListener("click", function(){
      remember(); ov.remove();
      openBackupModal().then(function(){ var box = document.getElementById("sync-preview"); if(box) renderSyncPreview(buildSyncPlan(seedAsSyncData()), seedAsSyncData(), box); });
    });
  });
}
function migrateForwardFromSeed(){
  var vocabChanged = false;
  Object.keys(SEED_VOCAB||{}).forEach(function(kind){
    if(!Array.isArray(SEED_VOCAB[kind])) return;
    VOCAB[kind] = VOCAB[kind] || [];
    SEED_VOCAB[kind].forEach(function(v){
      if(VOCAB[kind].indexOf(v)===-1){ VOCAB[kind].push(v); vocabChanged = true; }
    });
    if(vocabChanged) VOCAB[kind].sort(function(a,b){return a.localeCompare(b,'ko');});
  });
  if(vocabChanged) persistVocab();

  var cardsChanged = false;
  var seedById = {};
  (SEED_CARDS||[]).forEach(function(c){ seedById[c.id] = c; });
  (CARDS||[]).forEach(function(c){
    var seed = seedById[c.id];
    if(!seed) return;
    var cur = String(c.submit_law||"").trim();
    if((cur==="" || cur==="-") && seed.submit_law && seed.submit_law!=="-"){
      c.submit_law = seed.submit_law;
      cardsChanged = true;
    }
  });
  if(cardsChanged && idb && canWrite){
    CARDS.forEach(function(c){ idbPut("cards", c).catch(function(){}); });
  }
  if(vocabChanged || cardsChanged){
    setTimeout(function(){ showToast("새 법령/규정 목록과 업데이트된 내용을 불러왔습니다"); }, 600);
  }
}

function cloudListen(){
  var db = cloud.db;
  function onErr(e){ cloudFail(e); }
  cloud.unsubs.push(db.collection("cards").onSnapshot(function(snap){
    var changed = [];
    snap.docChanges().forEach(function(ch){
      if(ch.type==="removed" || ch.doc.metadata.hasPendingWrites) return;
      var json = ch.doc.data().json;
      if(cloud.lastJson[ch.doc.id]===json) return;
      cloud.lastJson[ch.doc.id] = json;
      var c = cloudParse(ch.doc); if(c) changed.push(c);
    });
    if(changed.length) cloudApplyRemote(changed);
    if(cloud.status==="wait") cloudSetStatus("ok");
  }, onErr));
  cloud.unsubs.push(db.collection("meta").doc("vocab").onSnapshot(function(d){
    if(!d.exists || d.metadata.hasPendingWrites) return;
    var j = d.data().json; if(j===cloud.vocabJson) return; cloud.vocabJson = j;

  }, onErr));
  cloud.unsubs.push(db.collection("events").onSnapshot(function(snap){
    var evs = [], removed = [];

      if(ch.doc.metadata.hasPendingWrites) return;

  }

    for(var i=0;i<5 && out.size>CLOUD_BLOB_MAX;i++){
      var cv = document.createElement("canvas"); cv.width = Math.max(1,Math.round(bmp.width*scale)); cv.height = Math.max(1,Math.round(bmp.height*scale));
      cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
      out = await new Promise(function(r){ cv.toBlob(r, "image/jpeg", q); });
      scale *= 0.8; q -= 0.08;
    }
    return out;
  }catch(e){ return blob; }
}
async function cloudPushBlobsFor(card){
  var ids = cloudRefsOf(card);
  for(var i=0;i<ids.length;i++){
    var id = ids[i];
    if(cloud.blobSent[id] || !blobUrlCache[id]) continue;
    try{
      var blob = await (await fetch(blobUrlCache[id])).blob();
      var meta = null;
      try{ meta = idb ? await idbGet("blobs", id) : null; }catch(e){}
      var small = await shrinkImageBlob(blob);
      if(small.size > CLOUD_BLOB_MAX){
        cloud.blobSent[id] = true;
        if(!cloud.bigWarned){ cloud.bigWarned = true; showToast("⚠ 700KB가 넘는 파일은 온라인에 올리지 못해 이 기기에서만 보입니다"); }
        continue;
      }
      var b64 = await blobToDataB64(small);
      await cloud.db.collection("blobs").doc(id).set({b64:b64, type:small.type||"application/octet-stream", name:(meta&&meta.name)||"", size:small.size});
      cloud.blobSent[id] = true;
    }catch(e){ throw e; }
  }
}
function cloudFetchBlob(bid){
  if(!cloud.on || !cloud.ready || cloud.blobPending[bid] || cloud.blobSent["x"+bid]) return;
  cloud.blobPending[bid] = true;
  cloud.db.collection("blobs").doc(bid).get().then(function(d){
    delete cloud.blobPending[bid];
    if(!d.exists){ cloud.blobSent["x"+bid] = true; return; }
    var v = d.data(), bin = atob(v.b64), arr = new Uint8Array(bin.length);
    for(var j=0;j<bin.length;j++) arr[j] = bin.charCodeAt(j);
    var blob = new Blob([arr], {type:v.type});
    blobUrlCache[bid] = URL.createObjectURL(blob);
    cloud.blobSent[bid] = true;
    if(idb && canWrite){ cloud.applying = true; idbPut("blobs", {id:bid, blob:blob, name:v.name, contentType:v.type, sizeBytes:blob.size}).catch(function(){}).then(function(){ cloud.applying = false; }); }
    cloudRerender();
  }).catch(function(){ delete cloud.blobPending[bid]; });
}

function boot(){
  if(!location.hash) location.hash = "toc";
  wireHelpModalOnce();
  document.getElementById("app").innerHTML = '<div class="loading-state gutter"><div class="spinner"></div>업무카드 데이터를 불러오는 중입니다…</div>';

  openDB().then(function(d){
    idb = d; storageOk = true; canWrite = true;
    return idbAll("cards");
  }).then(function(existing){
    if(existing && existing.length){
      CARDS = existing;
      return idbGet("meta","vocab").then(function(v){ VOCAB = (v && v.value) || JSON.parse(JSON.stringify(SEED_VOCAB)); });
    }
    CARDS = SEED_CARDS.map(function(c){ return JSON.parse(JSON.stringify(c)); });
    VOCAB = JSON.parse(JSON.stringify(SEED_VOCAB));
    var writes = CARDS.map(function(c){ return idbPut("cards", c); });
    writes.push(idbPut("meta", {key:"vocab", value:VOCAB}));
    return Promise.all(writes);
  }).then(function(){
    return idbGet("meta","seqCounter");
  }).then(function(sc){
    var maxSeq = CARDS.reduce(function(m,c){return Math.max(m,c.seq||0);},0);
    seqCounter = Math.max((sc && sc.value) || 0, maxSeq);
    return idbAll("events");
  }).then(function(existingEvents){
    if(existingEvents && existingEvents.length){ EVENTS = existingEvents; return null; }
    EVENTS = SEED_EVENTS.map(function(e){ return JSON.parse(JSON.stringify(e)); });
    return Promise.all(EVENTS.map(function(e){ return idbPut("events", e); }));
  }).then(function(){
    return idbAll("blobs");
  }).then(function(blobs){
    (blobs||[]).forEach(function(b){ try{ blobUrlCache[b.id] = URL.createObjectURL(b.blob); }catch(e){} });
    return Promise.all([idbGet("meta","syncState").catch(function(){return null;}), idbDel("meta","shareDirHandle").catch(function(){})]);
  }).then(function(r){
    if(r && r[0] && r[0].value) syncState = r[0].value;
    return ensureDailyBackup();
  }).then(function(){
    migrateForwardFromSeed();
    refreshSnaps();
    route();
    cloudInit();
    setTimeout(offerSeedMerge, 2600);
  }).catch(function(){
    storageOk = false; canWrite = false;
    CARDS = SEED_CARDS.slice();
    VOCAB = JSON.parse(JSON.stringify(SEED_VOCAB));
    EVENTS = SEED_EVENTS.slice();
    seqCounter = CARDS.reduce(function(m,c){return Math.max(m,c.seq||0);},0);
    route();
    showToast("⚠ 이 브라우저에서는 로컬 저장소를 사용할 수 없어 변경사항이 저장되지 않습니다");
  });
}
boot();

window.addEventListener("keydown", function(e){
  if(editMode) return;
  if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if(location.hash.indexOf("card/")===0){
    if(e.key==="Escape") location.hash="toc";
  }
});

})();
</script>
